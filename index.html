<meta charset="UTF-8">
<title>Skyldhjulet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&family=Work+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #ffffff;
    --bg-spot: #ffffff;
    --surface: #fbf7ec;
    --surface-2: #f1ead6;
    --ink: #1c2c22;
    --ink-soft: #55634f;
    --accent: #e2632b;
    --accent-hover: #c9511d;
    --accent-ink: #fff6ec;
    --rim: #142218;
    --border: rgba(28, 44, 34, 0.16);
    --shadow: rgba(20, 34, 24, 0.28);

    --wheel-green: #1f3b2e;
    --wheel-beige: #e7dcc0;
    --wheel-text-light: #f5efdd;
    --wheel-text-dark: #1f3b2e;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #132219;
      --bg-spot: #17291f;
      --surface: #1c2f24;
      --surface-2: #223a2b;
      --ink: #f1e9d6;
      --ink-soft: #b7c2af;
      --accent: #f07a3f;
      --accent-hover: #f5905e;
      --accent-ink: #1b120a;
      --rim: #0d1712;
      --border: rgba(241, 233, 214, 0.14);
      --shadow: rgba(0, 0, 0, 0.5);
    }
  }

  :root[data-theme="dark"] {
    --bg: #132219;
    --bg-spot: #17291f;
    --surface: #1c2f24;
    --surface-2: #223a2b;
    --ink: #f1e9d6;
    --ink-soft: #b7c2af;
    --accent: #f07a3f;
    --accent-hover: #f5905e;
    --accent-ink: #1b120a;
    --rim: #0d1712;
    --border: rgba(241, 233, 214, 0.14);
    --shadow: rgba(0, 0, 0, 0.5);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(circle at 50% 18%, var(--bg-spot) 0%, var(--bg) 62%);
    color: var(--ink);
    font-family: "Work Sans", ui-sans-serif, system-ui, sans-serif;
    display: flex;
    justify-content: center;
    padding: clamp(24px, 5vw, 56px) 20px 40px;
  }

  .stage {
    width: 100%;
    max-width: 560px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(18px, 3vw, 28px);
  }

  .marquee {
    text-align: center;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  h1 {
    margin: 0;
    font-family: "Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif;
    font-weight: 800;
    font-size: clamp(2rem, 7vw, 2.9rem);
    line-height: 1.05;
    text-wrap: balance;
  }

  .tagline {
    margin: 0;
    color: var(--ink-soft);
    font-size: 0.98rem;
  }

  .wheel-area {
    position: relative;
    width: clamp(260px, 62vw, 380px);
    aspect-ratio: 1 / 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .pointer {
    position: absolute;
    top: -6px;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 15px solid transparent;
    border-right: 15px solid transparent;
    border-top: 26px solid var(--accent);
    filter: drop-shadow(0 3px 3px var(--shadow));
    z-index: 3;
  }

  .wheel-rim {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: var(--rim);
    padding: 10px;
    box-shadow: 0 18px 34px var(--shadow), inset 0 0 0 2px rgba(255, 255, 255, 0.05);
  }

  .wheel {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    overflow: hidden;
    transform: rotate(0deg);
    box-shadow: inset 0 0 0 3px rgba(0, 0, 0, 0.18);
  }

  .wheel.spinning-flash {
    animation: flash 0.7s ease-out;
  }

  @keyframes flash {
    0% { box-shadow: inset 0 0 0 3px rgba(0,0,0,0.18), 0 0 0 0 var(--accent); }
    35% { box-shadow: inset 0 0 0 3px rgba(0,0,0,0.18), 0 0 0 14px color-mix(in srgb, var(--accent) 55%, transparent); }
    100% { box-shadow: inset 0 0 0 3px rgba(0,0,0,0.18), 0 0 0 0 transparent; }
  }

  .segment-label {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 36%;
    text-align: center;
    font-family: "Work Sans", sans-serif;
    font-weight: 700;
    font-size: clamp(0.66rem, 2.3vw, 0.84rem);
    letter-spacing: 0.02em;
    line-height: 1.15;
    text-wrap: balance;
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.18);
    pointer-events: none;
  }

  .hub {
    position: absolute;
    width: 22%;
    height: 22%;
    border-radius: 50%;
    background: var(--rim);
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 6px var(--shadow), inset 0 0 0 2px var(--accent);
  }

  .hub::after {
    content: "";
    width: 34%;
    height: 34%;
    border-radius: 50%;
    background: var(--accent);
  }

  .spin-btn {
    appearance: none;
    border: none;
    cursor: pointer;
    font-family: "Bricolage Grotesque", sans-serif;
    font-weight: 800;
    font-size: 1.05rem;
    letter-spacing: 0.03em;
    color: var(--accent-ink);
    background: var(--accent);
    padding: 16px 42px;
    border-radius: 999px;
    box-shadow: 0 10px 0 var(--accent-hover), 0 16px 22px var(--shadow);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }

  .spin-btn:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 12px 0 var(--accent-hover), 0 20px 26px var(--shadow);
  }

  .spin-btn:active:not(:disabled) {
    transform: translateY(3px);
    box-shadow: 0 6px 0 var(--accent-hover), 0 10px 14px var(--shadow);
  }

  .spin-btn:disabled {
    cursor: not-allowed;
    opacity: 0.7;
  }

  .spin-btn:focus-visible {
    outline: 3px solid var(--accent-hover);
    outline-offset: 3px;
  }

  .ticket {
    position: relative;
    width: min(100%, 400px);
    background: var(--surface);
    border-radius: 14px;
    padding: 20px 24px 18px;
    box-shadow: 0 12px 24px var(--shadow);
    text-align: center;
    opacity: 0;
    transform: translateY(10px) scale(0.98);
    transition: opacity 0.35s ease, transform 0.35s ease;
  }

  .ticket.visible {
    opacity: 1;
    transform: translateY(0) scale(1);
  }

  .ticket::before,
  .ticket::after {
    content: "";
    position: absolute;
    width: 18px;
    height: 18px;
    background: var(--bg);
    border-radius: 50%;
    top: 50%;
    transform: translateY(-50%);
  }

  .ticket::before { left: -9px; }
  .ticket::after { right: -9px; }

  .ticket-dept {
    margin: 0 0 10px;
    font-family: "Bricolage Grotesque", sans-serif;
    font-weight: 800;
    font-size: 1.6rem;
  }

  .ticket-comment {
    margin: 0;
    color: var(--ink-soft);
    font-size: 0.96rem;
    line-height: 1.4;
  }

  .tally {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 18px;
    border-radius: 999px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    font-family: "Space Mono", monospace;
  }

  .tally-label {
    font-size: 0.72rem;
    letter-spacing: 0.06em;
    color: var(--ink-soft);
  }

  .tally-count {
    font-size: 0.95rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }

  .share-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    text-decoration: none;
    font-family: "Work Sans", sans-serif;
    font-weight: 600;
    font-size: 0.88rem;
    color: var(--wheel-green);
    background: transparent;
    border: 1.5px solid var(--wheel-green);
    border-radius: 999px;
    padding: 9px 20px;
    transition: background 0.15s ease, color 0.15s ease;
  }

  .share-btn svg {
    width: 15px;
    height: 15px;
    flex-shrink: 0;
  }

  .share-btn:hover {
    background: var(--wheel-green);
    color: var(--wheel-text-light);
  }

  .share-btn:focus-visible {
    outline: 3px solid var(--accent-hover);
    outline-offset: 3px;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .share-btn {
      color: var(--ink);
      border-color: var(--ink);
    }
    :root:not([data-theme="light"]) .share-btn:hover {
      background: var(--ink);
      color: var(--bg);
    }
  }

  :root[data-theme="dark"] .share-btn {
    color: var(--ink);
    border-color: var(--ink);
  }
  :root[data-theme="dark"] .share-btn:hover {
    background: var(--ink);
    color: var(--bg);
  }

  @media (prefers-reduced-motion: reduce) {
    .ticket, .spin-btn, .share-btn { transition: none; }
    .wheel.spinning-flash { animation: none; }
  }
</style>

<div class="stage">
  <div class="marquee">
    <h1>Skyldhjulet</h1>
    <p class="tagline">Noget gik galt. Hvem får skylden?</p>
  </div>

  <div class="wheel-area">
    <div class="pointer" aria-hidden="true"></div>
    <div class="wheel-rim">
      <div class="wheel" id="wheel"></div>
    </div>
    <div class="hub" aria-hidden="true"></div>
  </div>

  <button class="spin-btn" id="spinBtn" type="button">Spin hjulet</button>

  <div class="ticket" id="ticket" role="status" aria-live="polite">
    <p class="ticket-dept" id="ticketDept">—</p>
    <p class="ticket-comment" id="ticketComment"></p>
  </div>

  <div class="tally">
    <span class="tally-label">Spins i alt</span>
    <span class="tally-count" id="tallyCount">00000</span>
  </div>

  <a
    class="share-btn"
    href="https://www.linkedin.com/sharing/share-offsite/?url=https%3A%2F%2Fclaude.ai%2Fcode%2Fartifact%2Fec7f30a9-5780-4aeb-94b9-6f5a4bcc4494"
    target="_blank"
    rel="noopener noreferrer"
  >
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M18 8a3 3 0 1 0-2.83-4H15a3 3 0 1 0 .07 3.24L9.9 10.2a3 3 0 1 0 0 3.6l5.16 3a3 3 0 1 0 .87-1.72l-5.16-3a3 3 0 0 0 0-1.16l5.16-3A3 3 0 0 0 18 8Z" />
    </svg>
    Del på LinkedIn
  </a>
</div>

<script>
  const DEPARTMENTS = ["Salg", "HR", "Supply Chain", "Økonomi", "IT", "Indkøb", "Jura", "Marketing"];
  const RIGGED = ["Supply Chain", "Indkøb"];
  const SEG_COLORS = ["beige", "green", "orange", "beige", "green", "orange", "beige", "green"];
  const segCount = DEPARTMENTS.length;
  const segAngle = 360 / segCount;

  const wheel = document.getElementById("wheel");
  const spinBtn = document.getElementById("spinBtn");
  const ticket = document.getElementById("ticket");
  const ticketDept = document.getElementById("ticketDept");
  const ticketComment = document.getElementById("ticketComment");
  const tallyCount = document.getElementById("tallyCount");

  const colorVar = { beige: "var(--wheel-beige)", green: "var(--wheel-green)", orange: "var(--accent)" };
  const textVar = { beige: "var(--wheel-text-dark)", green: "var(--wheel-text-light)", orange: "var(--accent-ink)" };

  const stops = SEG_COLORS.map((c, i) => {
    const from = (i * segAngle).toFixed(4);
    const to = ((i + 1) * segAngle).toFixed(4);
    return `${colorVar[c]} ${from}deg ${to}deg`;
  }).join(", ");
  wheel.style.background = `conic-gradient(${stops})`;

  const labelRadiusPct = 33;
  DEPARTMENTS.forEach((name, i) => {
    const center = i * segAngle + segAngle / 2;
    const rad = (center * Math.PI) / 180;
    const left = 50 + labelRadiusPct * Math.sin(rad);
    const top = 50 - labelRadiusPct * Math.cos(rad);
    const label = document.createElement("div");
    label.className = "segment-label";
    label.textContent = name;
    label.style.color = textVar[SEG_COLORS[i]];
    label.style.left = `${left}%`;
    label.style.top = `${top}%`;
    label.style.transform = `translate(-50%, -50%) rotate(${center}deg)`;
    wheel.appendChild(label);
  });

  const STORAGE_KEY = "inact-wheel-of-blame-total-spins";
  let totalSpins = parseInt(localStorage.getItem(STORAGE_KEY) || "0", 10);
  let currentRotation = 0;
  let spinning = false;

  function renderTally() {
    tallyCount.textContent = String(totalSpins).padStart(5, "0");
  }
  renderTally();

  const SPECIAL_LINE = "Prøver du stadig at give en anden afdeling skylden? Bliv endelig ved!";

  const COMMENT_TEMPLATES = [
    "De flagede det her ikke tidligt nok.",
    "Det er nok noget for dem, ikke?",
    "Det her ville ikke være et problem, hvis de gjorde deres arbejde ordentligt.",
    "Lad os bare sige, det var dem.",
    "De godkendte det da — ikke?",
    "Det sad fast i deres proces.",
    "Var det ikke dem, der havde ansvaret for det her?",
    "De skulle have løst det her.",
    "De skulle have eskaleret det noget før.",
    "Hvis de havde bedre værktøjer, var det her nok ikke sket.",
    "De sagde, det var fint.",
    "Var det ikke deres ansvar?",
    "Vi stolede på, at de tog sig af det.",
    "Forsinkelsen er nok dem igen.",
  ];

  let lastComment = null;

  function getComment(spinOrdinal) {
    if (spinOrdinal % 3 === 0) return SPECIAL_LINE;
    let text;
    let attempts = 0;
    do {
      text = COMMENT_TEMPLATES[Math.floor(Math.random() * COMMENT_TEMPLATES.length)];
      attempts += 1;
    } while (text === lastComment && attempts < 6);
    lastComment = text;
    return text;
  }

  function pickTarget() {
    const dept = RIGGED[Math.random() < 0.5 ? 0 : 1];
    return DEPARTMENTS.indexOf(dept);
  }

  const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function spin() {
    if (spinning) return;
    spinning = true;
    spinBtn.disabled = true;
    ticket.classList.remove("visible");

    const targetIndex = pickTarget();
    const center = targetIndex * segAngle + segAngle / 2;
    const jitter = (Math.random() - 0.5) * (segAngle * 0.55);
    const desiredMod = ((360 - center - jitter) % 360 + 360) % 360;

    const extraTurns = reducedMotion ? 1 : 4 + Math.floor(Math.random() * 3);
    const currentMod = ((currentRotation % 360) + 360) % 360;
    const delta = ((desiredMod - currentMod) % 360 + 360) % 360;

    currentRotation += extraTurns * 360 + delta;

    const duration = reducedMotion ? 900 : 3600 + Math.random() * 800;
    wheel.style.transition = `transform ${duration}ms cubic-bezier(0.14, 0.65, 0.15, 1)`;
    wheel.style.transform = `rotate(${currentRotation}deg)`;

    window.setTimeout(() => {
      const dept = DEPARTMENTS[targetIndex];
      totalSpins += 1;
      localStorage.setItem(STORAGE_KEY, String(totalSpins));
      renderTally();

      ticketDept.textContent = dept;
      ticketComment.textContent = getComment(totalSpins);
      ticket.classList.add("visible");

      if (!reducedMotion) {
        wheel.classList.remove("spinning-flash");
        void wheel.offsetWidth;
        wheel.classList.add("spinning-flash");
      }

      spinning = false;
      spinBtn.disabled = false;
    }, duration + 60);
  }

  spinBtn.addEventListener("click", spin);
</script>
